<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #43543a; color: #f1eadb; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  button { margin: 0 6px 6px 0; padding: 6px 10px; border-radius: 4px; border: 1px solid #b9ae8c; background: #2f3b29; color: inherit; cursor: pointer; }
  label { margin-right: 14px; }
  #meter { font-family: ui-monospace, monospace; margin-top: 14px; }
</style>
</head>
<body>
<h1>Sound sheet: every sound effect and both pieces of music (click anything first: browsers start audio only after a click)</h1>
<label><input type="checkbox" id="musicOpt"> Music</label><label><input type="checkbox" id="sfxOpt"> Sounds</label>
<h2>Music</h2>
<div id="music"></div>
<h2>Effects</h2>
<div id="fx"></div>
<p id="meter">Peak: –</p>
<script type="module">
import { sfx, setMusic, initSound, audioNodes } from '../js/ui/audio.js';
initSound();

const man = { T: { base: 25 } }, troll = { T: { base: 60 } };
const dice = n => sfx.dice(Array.from({ length: n }, (_, i) => ({ delay: i * 55 + Math.random() * 70, hops: 2 + Math.floor(Math.random() * 2) })), 1000);
const MUSIC = { 'Before the battle (menu)': () => setMusic('eve', 1), 'Battle (move, shoot)': () => setMusic('battle', 1), 'Battle (fight)': () => setMusic('battle', 2) };
const FX = {
  '1 die': () => dice(1), '3 dice': () => dice(3), '9 dice': () => dice(9), 'Bow: hit': () => sfx.shot('hit'), 'Bow: miss': () => sfx.shot('miss'),
  'Bow: stopped by cover': () => sfx.shot('block'), 'Crossbow: hit': () => sfx.shot('hit', true), 'Blades clash': () => sfx.clash(),
  'Wound': () => sfx.wound(man), 'Slain': () => sfx.death(man), 'Troll slain': () => sfx.death(troll), 'Armour holds': () => sfx.armour(),
  'Footsteps': () => sfx.steps(600), 'Charge (Good)': () => sfx.horn('good'), 'Charge (Evil)': () => sfx.horn('evil'),
  'New rule': () => sfx.lesson(), 'Victory': () => sfx.result(true), 'Defeat': () => sfx.result(false),
};
const add = (box, list) => { for (const [k, f] of Object.entries(list)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => setTimeout(f, 30); document.getElementById(box).append(b); } };
add('music', MUSIC); add('fx', FX);

// Peak level after the compressor, held for 3 seconds.
let an = null, buf = null, hold = 0, holdAt = 0;
function meter() {
  const A = audioNodes();
  if (A.ctx && !an) { an = A.ctx.createAnalyser(); an.fftSize = 2048; A.out.connect(an); buf = new Float32Array(an.fftSize); }
  if (an) {
    an.getFloatTimeDomainData(buf);
    let p = 0; for (const v of buf) p = Math.max(p, Math.abs(v));
    const now = performance.now();
    if (p > hold || now - holdAt > 3000) { hold = p; holdAt = now; }
    document.getElementById('meter').textContent = `Peak: ${p.toFixed(2)}  (held ${hold.toFixed(2)}, ${(20 * Math.log10(hold || 1e-6)).toFixed(1)} dBFS)`;
  }
  requestAnimationFrame(meter);
}
meter();
</script>
</body>
</html>
